default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: ^docs/evidence/
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: publish-check
        name: publication guard (staged files)
        entry: uv run python scripts/check_publication.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-msg-check
        name: publication guard (commit message)
        entry: uv run python scripts/check_publication.py --commit-msg
        language: system
        stages: [commit-msg]
