# Column inventory of the Lending Club accepted-loans file (151 columns).
# Single source of truth for: model allowlist, PII handling, publication guard and data docs.
#
# cat  : identificador_direto | quase_identificador | texto_livre | originacao | pos_originacao | alvo | metadado
# pii  : direto | quase | nao          (LGPD: dado pessoal identificado/identificável; nenhum "sensível" art. 5º II)
# use  : feature | segmento | alvo | chave | metadado | descartado
# why  : short rationale (only when not obvious)
#
# Evidence: data dictionary (sheet browseNotes = fields visible at listing time) and univariate
# AUC scan on mature 2013 loans (post-origination leakage: recoveries 0.958, last_fico 0.896,
# last_credit_pull_d 0.856, total_rec_prncp 0.845).

columns:
  # --- identificadores e texto livre --------------------------------------------------------
  id: {cat: identificador_direto, pii: direto, use: chave, why: "pseudonimizado via HMAC; valor original nunca sai do loader"}
  member_id: {cat: identificador_direto, pii: direto, use: descartado, why: "100% nulo no arquivo"}
  url: {cat: identificador_direto, pii: direto, use: descartado, why: "contém o id"}
  emp_title: {cat: texto_livre, pii: quase, use: descartado, why: "texto livre do tomador; minimização"}
  desc: {cat: texto_livre, pii: quase, use: descartado, why: "texto livre do tomador; minimização"}
  title: {cat: texto_livre, pii: quase, use: descartado, why: "texto livre do tomador; minimização"}
  zip_code: {cat: quase_identificador, pii: quase, use: descartado, why: "3 dígitos de CEP; minimização (região coberta por addr_state)"}
  addr_state: {cat: quase_identificador, pii: quase, use: segmento, why: "fora do modelo (proxy regional); usado só em fairness e monitoramento"}
  earliest_cr_line: {cat: quase_identificador, pii: quase, use: descartado, why: "data bruta substituída pela derivada credit_history_months"}

  # --- alvo e metadados ---------------------------------------------------------------------
  loan_status: {cat: alvo, pii: nao, use: alvo}
  issue_d: {cat: metadado, pii: nao, use: metadado, why: "safra; eixo temporal da separação"}
  application_type: {cat: metadado, pii: nao, use: metadado, why: "escopo = Individual; Joint só existe a partir de 2015-12"}
  policy_code: {cat: metadado, pii: nao, use: descartado, why: "constante"}
  initial_list_status: {cat: originacao, pii: nao, use: descartado, why: "canal de investidor, não atributo do tomador"}
  disbursement_method: {cat: originacao, pii: nao, use: descartado, why: "só existe a partir de 2018"}
  funded_amnt: {cat: originacao, pii: nao, use: descartado, why: "redundante com loan_amnt"}
  funded_amnt_inv: {cat: originacao, pii: nao, use: descartado, why: "processo de funding por investidores; fora da aba browseNotes"}

  # --- features de originação (allowlist do modelo) -----------------------------------------
  loan_amnt: {cat: originacao, pii: nao, use: feature}
  term: {cat: originacao, pii: nao, use: feature}
  int_rate: {cat: originacao, pii: nao, use: feature}
  installment: {cat: originacao, pii: nao, use: feature}
  grade: {cat: originacao, pii: nao, use: feature}
  emp_length: {cat: originacao, pii: quase, use: feature, why: "também segmento de fairness"}
  home_ownership: {cat: originacao, pii: quase, use: feature, why: "também segmento de fairness"}
  annual_inc: {cat: originacao, pii: quase, use: feature}
  verification_status: {cat: originacao, pii: nao, use: feature}
  purpose: {cat: originacao, pii: nao, use: feature}
  dti: {cat: originacao, pii: nao, use: feature}
  delinq_2yrs: {cat: originacao, pii: nao, use: feature}
  fico_range_low: {cat: originacao, pii: quase, use: feature}
  inq_last_6mths: {cat: originacao, pii: nao, use: feature}
  mths_since_last_delinq: {cat: originacao, pii: nao, use: feature, why: "nulo = nunca inadimpliu"}
  open_acc: {cat: originacao, pii: nao, use: feature}
  pub_rec: {cat: originacao, pii: nao, use: feature}
  revol_bal: {cat: originacao, pii: nao, use: feature}
  revol_util: {cat: originacao, pii: nao, use: feature}
  total_acc: {cat: originacao, pii: nao, use: feature}
  mort_acc: {cat: originacao, pii: nao, use: feature}
  pub_rec_bankruptcies: {cat: originacao, pii: nao, use: feature}
  acc_open_past_24mths: {cat: originacao, pii: nao, use: feature}
  bc_util: {cat: originacao, pii: nao, use: feature}
  avg_cur_bal: {cat: originacao, pii: nao, use: feature}
  tot_hi_cred_lim: {cat: originacao, pii: nao, use: feature}
  num_actv_rev_tl: {cat: originacao, pii: nao, use: feature}
  percent_bc_gt_75: {cat: originacao, pii: nao, use: feature}
  mths_since_recent_inq: {cat: originacao, pii: nao, use: feature}
