  tot_cur_bal: {cat: originacao, pii: nao, use: feature}
  total_bc_limit: {cat: originacao, pii: nao, use: feature}

  # --- originação, descartadas por parcimônia/redundância/qualidade -------------------------
  sub_grade: {cat: originacao, pii: nao, use: descartado, why: "redundante com grade e int_rate"}
  fico_range_high: {cat: originacao, pii: quase, use: descartado, why: "fico_range_low + 4"}
  mths_since_last_record: {cat: originacao, pii: nao, use: descartado, why: "~88% nulo em 2013"}
  mths_since_last_major_derog: {cat: originacao, pii: nao, use: descartado, why: "~80% nulo em 2013"}
  collections_12_mths_ex_med: {cat: originacao, pii: nao, use: descartado, why: "quase constante"}
  acc_now_delinq: {cat: originacao, pii: nao, use: descartado, why: "quase constante"}
  chargeoff_within_12_mths: {cat: originacao, pii: nao, use: descartado, why: "quase constante"}
  delinq_amnt: {cat: originacao, pii: nao, use: descartado, why: "quase constante"}
  tax_liens: {cat: originacao, pii: nao, use: descartado, why: "quase constante"}
  num_tl_120dpd_2m: {cat: originacao, pii: nao, use: descartado, why: "dicionário: 'updated in past 2 months' (ambíguo) e quase constante"}
  num_tl_30dpd: {cat: originacao, pii: nao, use: descartado, why: "dicionário: 'updated in past 2 months' (ambíguo) e quase constante"}
  bc_open_to_buy: {cat: originacao, pii: nao, use: descartado, why: "redundância com total_bc_limit e bc_util"}
  mo_sin_old_il_acct: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  mo_sin_rcnt_rev_tl_op: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  mo_sin_rcnt_tl: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  mths_since_recent_bc: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  mths_since_recent_bc_dlq: {cat: originacao, pii: nao, use: descartado, why: "~78% nulo"}
  mths_since_recent_revol_delinq: {cat: originacao, pii: nao, use: descartado, why: "~70% nulo"}
  num_accts_ever_120_pd: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  num_actv_bc_tl: {cat: originacao, pii: nao, use: descartado, why: "redundância com num_actv_rev_tl"}
  num_bc_sats: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  num_bc_tl: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  num_il_tl: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  num_op_rev_tl: {cat: originacao, pii: nao, use: descartado, why: "redundância com open_acc"}
  num_rev_accts: {cat: originacao, pii: nao, use: descartado, why: "redundância com total_acc"}
  num_rev_tl_bal_gt_0: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  num_sats: {cat: originacao, pii: nao, use: descartado, why: "redundância com open_acc"}
  num_tl_90g_dpd_24m: {cat: originacao, pii: nao, use: descartado, why: "quase constante"}
  num_tl_op_past_12m: {cat: originacao, pii: nao, use: descartado, why: "redundância com acc_open_past_24mths"}
  pct_tl_nvr_dlq: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
  total_bal_ex_mort: {cat: originacao, pii: nao, use: descartado, why: "redundância com tot_cur_bal"}
  total_il_high_credit_limit: {cat: originacao, pii: nao, use: descartado, why: "parcimônia"}
