# Decision economics (ADR-0016).
# Premises lgd / margin_realization / bad_interest_realization are measured on realized cash of
# mature 2013 reference loans (train split) by `make cost`; funding_rate is a declared policy premise.
status: ESTIMADO               # lgd / margin / bad interest measured; funding_rate declared
source_run: RUN-20261113-calib-COST-02
# Approving a loan that defaults loses loan_amnt * lgd (net of interest paid and recoveries)
# plus the funding of the balance it carried until default.
lgd: 0.327
# A good loan realizes this share of the contractual interest (installment * term - loan_amnt).
margin_realization: 0.756
# A bad loan pays this share of the contractual interest before default (drives its funding cost).
bad_interest_realization: 0.564
# Annual cost of funding the outstanding balance (policy premise, ADR-0016 option B).
funding_rate: 0.05
# Global cut-off searched on the calibration set: approve when score < threshold.
threshold_grid: {start: 0.02, stop: 0.60, step: 0.005}
# Funding rates for the realized-cash sensitivity.
funding_rate_grid: [0.0, 0.03, 0.05, 0.08, 0.10]
# Risk appetite (ADR-0016 option D): cap used by the conservative mode (GR-4, F7),
# not by the base threshold.
risk_appetite:
  status: PROPOSTO
  max_bad_rate_approved: 0.14
