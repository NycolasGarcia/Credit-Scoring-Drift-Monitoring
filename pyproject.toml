[project]
name = "credit-drift-monitoring"
version = "0.1.0"
description = "Credit scoring model sustainment: data contracts, drift detection, observability and degradation response."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Nycolas Garcia" }]
dependencies = [
    "evidently==0.7.23",
    "mlflow==3.18.0",
    "numpy==2.5.4",
    "pandas==2.3.3",  # evidently 0.7.23 is incompatible with pandas 3.x (ADR-0001)
    "pandera==0.36.0",
    "prometheus-client==0.26.0",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "xgboost==3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "nbconvert==7.17.2",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "SIM", "T20", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
