# Prometheus da stack local (ADR-0010). O job batch publica no Pushgateway; honor_labels
# preserva o rótulo `scenario` do grupo publicado.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
